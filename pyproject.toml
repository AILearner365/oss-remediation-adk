[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-oss-vulnerability-remediation"
version = "0.1.0"
description = "Autonomous OSS Vulnerability Remediation using native OpenHands"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
native = ["openhands-sdk[vertex]==1.55.1", "openhands-tools==1.55.1"]

[project.scripts]
oss-remediate = "native_remediation.cli:main"

[tool.setuptools.packages.find]
include = ["native_remediation*"]

[tool.setuptools.package-data]
native_remediation = ["guidance/*.md", "skills/*/SKILL.md"]
